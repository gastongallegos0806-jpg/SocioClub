spring.application.name=socioclub

# ===== Conexión a MySQL =====
# createDatabaseIfNotExist=true: si la base "socioclub" no existe, la crea.
spring.datasource.url=jdbc:mysql://localhost:3306/socioclub?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Cordoba&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
# CAMBIAR por la contraseña de root que eligieron al instalar MySQL
spring.datasource.password=root

# ===== JPA / Hibernate =====
# create: al arrancar, Hibernate BORRA y vuelve a CREAR las tablas a partir de las entidades.
# Así cada vez que se levanta el sistema arranca con los datos iniciales limpios (ideal para la demo).
spring.jpa.hibernate.ddl-auto=create
# Muestra en la consola el SQL que genera Hibernate (sirve para explicar el ORM en la defensa)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Datos iniciales (data.sql) =====
# Ejecutar data.sql DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
